# LOCAL PROOF OF CONCEPT. Not deployed. One TLS entry point, three hostnames, default-deny paths.
# Upstreams are the existing loopback services; nothing here publishes HEC (8088), OTel (4317/4318),
# Splunk management (8089), Ollama or the verifier.
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  access_log /dev/stdout;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate     /etc/nginx/tls/server.pem;
  ssl_certificate_key /etc/nginx/tls/server.key;
  limit_req_zone $binary_remote_addr zone=attack:1m rate=6r/m;
  limit_req_status 503;
  map $http_upgrade $conn_up { default upgrade; "" close; }

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Plain HTTP only redirects.
  server { listen 8080; server_name _; return 308 https://$host$request_uri; }

  # Academy (read-only learner surface). Attack execution is a separate, opt-in tier (attack-tier.conf).
  server {
    listen 8443 ssl default_server;
    server_name learn.lab.test;
    auth_basic "AgentSecLab"; auth_basic_user_file /etc/nginx/htpasswd;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";   # credentials stop at the proxy
    location = / { return 302 /learn; }
    location ~ ^/(learn|static/|favicon\.ico$|api/learn/config$|api/academy/status$) {
      limit_except GET { deny all; }
      proxy_pass http://host.docker.internal:15001;
    }
    include /etc/nginx/attack-tier.conf;   # remove this line to disable attack execution entirely
    location / { return 404; }
  }

  # AcmeBank: read-only on its own hostname (the app uses absolute paths, so no sub-path proxy).
  server {
    listen 8443 ssl;
    server_name bank.lab.test;
    auth_basic "AgentSecLab"; auth_basic_user_file /etc/nginx/htpasswd;
    proxy_set_header Authorization "";
    location / { limit_except GET { deny all; } proxy_pass http://host.docker.internal:15000; }
  }

  # Splunk Web only (8000). Splunk keeps its own login behind this gate; PoC upstream ports are offset (15000/15001/18000) to avoid local services; 8088/8089 are never proxied.
  server {
    listen 8443 ssl;
    server_name splunk.lab.test;
    auth_basic "AgentSecLab"; auth_basic_user_file /etc/nginx/htpasswd;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $conn_up; proxy_http_version 1.1;
    location / { proxy_pass http://host.docker.internal:18000; }
  }
}
