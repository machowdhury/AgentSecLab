# The ONLY routes that start attacks or run mission searches. Authenticated, rate-limited, POST allowed.
location ~ ^/api/(launch$|attacks/ATK-002$|missions/loan-desk/(status$|search/templates$|runs(/[A-Za-z0-9_-]+(/(search(/preview|/[A-Za-z0-9_-]+)?|verify))?)?$)|launches/[A-Za-z0-9_-]+(/evidence)?$) {
  limit_except GET POST { deny all; }
  limit_req zone=attack burst=10 nodelay;
  client_max_body_size 64k;
  proxy_pass http://host.docker.internal:15001;
}
