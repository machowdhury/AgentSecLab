# Milestone 1 gateway POC. Default-deny. Credentials stop here; identity headers from clients are never trusted.
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  absolute_redirect off;                         # nginx-generated redirects stay relative: no leaking of the container port
  access_log /dev/stdout;
  resolver 127.0.0.11 valid=10s ipv6=off;       # Docker DNS; variable proxy_pass so a late backend never blocks startup
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate     /certs/server.pem;         # leaf + chain, mounted read-only from files
  ssl_certificate_key /certs/server.key;
  limit_req_zone $binary_remote_addr zone=attack:1m rate=6r/m;
  limit_req_status 429;
  map $http_upgrade $conn_up { default upgrade; "" close; }
  map $remote_user $role { default learner; operator operator; }   # role comes only from the authenticated user
  # internal authorization subrequest target for the attack tier (runs after auth_basic, so anonymous gets 401 and a learner 403)
  server { listen 127.0.0.1:8081; location = /_authz_operator { if ($http_x_authz_user = operator) { return 204; } return 403; } }

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Unknown or missing SNI hostnames fail the TLS handshake (fails closed).
  server { listen 8443 ssl default_server; ssl_reject_handshake on; }

  server {
    listen 8443 ssl;
    server_name learn.poc.test;
    auth_basic "AgentSecLab POC"; auth_basic_user_file /etc/nginx/htpasswd;
    set $attack http://attack:5001;
    proxy_set_header Host $host;
    include /etc/nginx/identity-headers.conf;
    location = / { return 302 /learn; }               # one canonical entry point
    location ~ ^/(learn(/|$)|static/|favicon\.ico$|health$|api/learn/config$|api/academy/status$|api/labs/[A-Za-z0-9_-]+$|api/missions/loan-desk/status$) {
      limit_except GET { deny all; }
      proxy_pass $attack;
    }
    include /etc/nginx/attack-tier.conf;
    location / { return 404; }
  }

  server {
    listen 8443 ssl;
    server_name bank.poc.test;
    auth_basic "AgentSecLab POC"; auth_basic_user_file /etc/nginx/htpasswd;
    set $bank http://acmebank:5000;
    include /etc/nginx/identity-headers.conf;
    location / { limit_except GET { deny all; } proxy_pass $bank; }
  }

  # Splunk Web on its own hostname (no sub-path). Gateway auth in front of Splunk's own login.
  server {
    listen 8443 ssl;
    server_name splunk.poc.test;
    auth_basic "AgentSecLab POC"; auth_basic_user_file /etc/nginx/htpasswd;
    set $splunk http://splunk-stub:8000;
    proxy_set_header Host $host;
    include /etc/nginx/identity-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_up;
    proxy_http_version 1.1;
    proxy_redirect http://splunk-stub:8000/ https://$http_host/;   # absolute backend redirects return to the host:port the client used
    proxy_cookie_flags ~ secure samesite=lax;         # add Secure; deliberately NOT httponly (Splunk's JS reads its CSRF cookie)
    location / { proxy_pass $splunk; }
  }
}
