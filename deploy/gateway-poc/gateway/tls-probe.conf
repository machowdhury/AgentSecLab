# TLS-only variant used by the certificate scenarios: proves what a client sees for each certificate set.
worker_processes 1;
events { worker_connections 64; }
http {
  server_tokens off;
  ssl_protocols TLSv1.2 TLSv1.3;
  server {
    listen 8443 ssl;
    server_name learn.poc.test;
    ssl_certificate /certs/server.pem;
    ssl_certificate_key /certs/server.key;
    location / { return 200 "tls-ok\n"; }
  }
}
