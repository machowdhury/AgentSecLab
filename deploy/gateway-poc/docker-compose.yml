# DISPOSABLE gateway proof of concept. Project name, container names, networks and images are all prefixed
# "agentsec-gw-poc" so nothing here can collide with, or be mistaken for, the real lab (project "agentseclab").
# Only the gateway publishes a port, and only on loopback. Backends live on an internal-only network.
name: agentsec-gw-poc
services:
  gateway:
    image: nginx:1.27-alpine
    container_name: agentsec-gw-poc-gateway
    labels: {agentsec.poc: m1-gateway}
    ports:
      - "127.0.0.1:${POC_HTTPS_PORT:-18443}:8443"
    networks: [edge, backend]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/attack-tier.conf:/etc/nginx/attack-tier.conf:ro
      - ./gateway/identity-headers.conf:/etc/nginx/identity-headers.conf:ro
      - ${POC_RUNTIME:?run scripts/run_poc.sh up}/certs/active:/certs:ro
      - ${POC_RUNTIME}/htpasswd:/etc/nginx/htpasswd:ro
    depends_on: [attack, acmebank, splunk-stub]
  attack:
    build: {context: ../.., dockerfile: docker/Dockerfile.attack}
    image: agentsec-gw-poc/attack:m1
    container_name: agentsec-gw-poc-attack
    labels: {agentsec.poc: m1-backend}
    networks: [backend]
    environment: [AGENTSEC_BIND_HOST=0.0.0.0, ATTACK_SERVICE_PORT=5001, "ACMEBANK_URL=http://acmebank:5000", AGENTSEC_ARTIFACTS_DIR=/app/artifacts]
  acmebank:
    build: {context: ../.., dockerfile: docker/Dockerfile.acmebank}
    image: agentsec-gw-poc/acmebank:m1
    container_name: agentsec-gw-poc-acmebank
    labels: {agentsec.poc: m1-backend}
    networks: [backend]
    # No Ollama and no OTel collector in the POC: AcmeBank starts degraded, which is enough for routing tests.
    environment: [AGENTSEC_BIND_HOST=0.0.0.0, ACMEBANK_PORT=5000, AGENTSEC_OTEL_ENABLED=false, "OLLAMA_BASE_URL=http://ollama-absent:11434", AGENTSEC_ARTIFACTS_DIR=/app/artifacts]
  splunk-stub:
    # NOT Splunk. A tiny server that mimics the proxy-relevant behaviours (cookies, CSRF header, absolute redirects, headers echo).
    image: python:3.12-alpine
    container_name: agentsec-gw-poc-splunk-stub
    labels: {agentsec.poc: m1-stub}
    command: ["python", "/stub/splunk_stub.py"]
    networks: [backend]
    environment: [STUB_PASSWORD]      # value comes from the git-ignored runtime creds, never from this file
    volumes: ["./stubs:/stub:ro"]
networks:
  backend: {name: agentsec-gw-poc-backend, internal: true}
  edge: {name: agentsec-gw-poc-edge}
