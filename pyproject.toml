[project]
name = "agentsec"
version = "0.3.0"
description = "AgentSec Lab — agentic AI security learning range"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "flask==3.0.3",
  "requests==2.32.3",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "jsonschema==4.23.0",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "live_ollama: requires a reachable local Ollama with the configured model",
    "live_splunk: requires local collector + Splunk; skipped unless AGENTSEC_LIVE_SPLUNK=1",
    "live_scanner: requires pinned cisco-ai-mcp-scanner 4.8.4 static CLI",
]
