[otel:agentic:json]
SHOULD_LINEMERGE = false
KV_MODE = json
INDEXED_EXTRACTIONS = json
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 10000
category = Custom
description = AgentSec OTLP JSON security events

[agentsec:scanner:finding]
SHOULD_LINEMERGE = false
KV_MODE = none
INDEXED_EXTRACTIONS = json
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 10000
category = Custom
description = AgentSec scanner evidence (scan summaries and native findings). Not otel:agentic:json. Not authorization.
