[Q-RUN]
disabled = 1
search = `agentsec_index` "agentsec.run.id"=*
request.ui_dispatch_app = agentsec
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = PLACEHOLDER — not Splunk-validated in Phase 2. Question: did this run.id produce events? Fill the run.id before use.

[Q-DENY]
disabled = 1
search = `agentsec_index` "agentsec.control.decision"=DENY "agentsec.operation.executed"=false "agentsec.testbed.mode"=LIVE
request.ui_dispatch_app = agentsec
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = PLACEHOLDER — not Splunk-validated in Phase 2. Question: which LIVE events have DENY and operation.executed=false?

[AgentSec - MCP Execution After Authorization Deny]
disabled = 1
enableSched = 0
cron_schedule = 0 * * * *
request.ui_dispatch_app = agentsec
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = Detects a tool execution event that begins after CTRL-MCP-001 denied the same MCP tool invocation within the same AgentSec run. Severity HIGH (authorization denied, execution nevertheless began). Lab id DET-MCP-001. Disabled by default. Not a general MCP bypass detector. Not an ES notable. Splunk does not enforce authorization.
search = index=agentsec_telemetry sourcetype=otel:agentic:json ("event.name"=agentsec.control.decision OR "event.name"=agentsec.mcp.started) | eval run_id=mvindex(mvdedup('agentsec.run.id'),0) | eval tool=mvindex(mvdedup('gen_ai.tool.name'),0) | eval event_name=mvindex(mvdedup('event.name'),0) | eval decision=mvindex(mvdedup('agentsec.control.decision'),0) | eval sequence=tonumber(mvindex(mvdedup('agentsec.sequence'),0)) | eval agent=mvindex(mvdedup('gen_ai.agent.id'),0) | eval principal=mvindex(mvdedup('agentsec.principal.id'),0) | eval control_id=mvindex(mvdedup('agentsec.control.id'),0) | eval profile=mvindex(mvdedup('agentsec.security.profile'),0) | eval mode=mvindex(mvdedup('agentsec.testbed.mode'),0) | eval requested_scope=mvindex(mvdedup('agentsec.mcp.requested_scope'),0) | eval allowed_scope=mvindex(mvdedup('agentsec.mcp.allowed_scope'),0) | eval trace_id=mvindex(mvdedup('trace_id'),0) | eval is_deny=if(event_name="agentsec.control.decision" AND decision="DENY",1,0) | eval is_started=if(event_name="agentsec.mcp.started",1,0) | eventstats min(eval(if(is_deny=1,sequence,null()))) as deny_sequence, max(is_deny) as has_deny, latest(eval(if(is_deny=1,agent,null()))) as agent, latest(eval(if(is_deny=1,principal,null()))) as principal, latest(eval(if(is_deny=1,control_id,null()))) as control_id, latest(eval(if(is_deny=1,profile,null()))) as profile, latest(eval(if(is_deny=1,mode,null()))) as mode, latest(eval(if(is_deny=1,requested_scope,null()))) as requested_scope, latest(eval(if(is_deny=1,allowed_scope,null()))) as allowed_scope, latest(eval(if(is_started=1,trace_id,null()))) as start_trace_id by run_id, tool | eval trace_id=coalesce(start_trace_id,trace_id) | where has_deny=1 AND is_started=1 AND sequence>deny_sequence | eval decision="DENY" | eval mcp_start_sequence=sequence | table run_id, tool, agent, principal, control_id, decision, deny_sequence, mcp_start_sequence, profile, mode, requested_scope, allowed_scope, trace_id
