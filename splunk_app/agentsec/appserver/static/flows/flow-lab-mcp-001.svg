<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 200" role="img" aria-labelledby="title desc">
<title id="title">Tool Authorization flow</title>
<desc id="desc">A tool request meets CTRL-MCP-001 before the handler. ALLOW is not execution.</desc>
<rect width="1440" height="200" fill="#F6F8FB"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17202A"/></marker></defs>
<g font-family="system-ui, Segoe UI, sans-serif" fill="#17202A">
<rect x="30" y="22" width="228" height="96" rx="6" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
<text x="144" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#17202A">USER / AGENT</text>
<text x="144" y="92" text-anchor="middle" font-size="16" fill="#17202A">asks for a tool</text>
<line x1="262" y1="70" x2="314" y2="70" stroke="#17202A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="318" y="22" width="228" height="96" rx="6" fill="#FFFFFF" stroke="#8AA0B4" stroke-width="2" stroke-dasharray="6 4"/>
<text x="432" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#17202A">TOOL REQUEST</text>
<text x="432" y="92" text-anchor="middle" font-size="16" fill="#17202A">tool · scope · arguments</text>
<line x1="550" y1="70" x2="602" y2="70" stroke="#17202A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="606" y="22" width="228" height="96" rx="6" fill="#0B1F33" stroke="#0B1F33" stroke-width="2"/>
<text x="720" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">CTRL-MCP-001</text>
<text x="720" y="92" text-anchor="middle" font-size="16" fill="#FFFFFF">ALLOW / DENY / ERROR</text>
<line x1="838" y1="70" x2="890" y2="70" stroke="#17202A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="894" y="22" width="228" height="96" rx="6" fill="#FFFFFF" stroke="#007F86" stroke-width="4"/>
<text x="1008" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#17202A">HANDLER START</text>
<text x="1008" y="92" text-anchor="middle" font-size="16" fill="#17202A">only after ALLOW</text>
<line x1="1126" y1="70" x2="1178" y2="70" stroke="#17202A" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="1182" y="22" width="228" height="96" rx="6" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1296" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#17202A">TELEMETRY</text>
<text x="1296" y="92" text-anchor="middle" font-size="16" fill="#17202A">Splunk observes</text>
<line x1="720" y1="118" x2="720" y2="156" stroke="#17202A" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="686" y1="160" x2="754" y2="160" stroke="#17202A" stroke-width="6"/>
<text x="766" y="167" font-size="16" font-weight="700" fill="#17202A">DENY / ERROR: the path ends here, no handler starts</text>
</g></svg>
