<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" role="img" aria-labelledby="title desc">
<title id="title">AI Asset Inventory flow</title>
<desc id="desc">A listed component is not trusted and not authorized.</desc>
<rect width="880" height="384" fill="#F6F8FB"/>
<g font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#17202A">
<rect x="120" y="28" width="640" height="48" rx="4" fill="#FFFFFF" stroke="#D9E0E7"/>
<text x="440" y="58" text-anchor="middle" fill="#17202A">COMPONENT LIST</text>
<path d="M440 76 V96" stroke="#8AA0B4" stroke-width="2" fill="none"/>
