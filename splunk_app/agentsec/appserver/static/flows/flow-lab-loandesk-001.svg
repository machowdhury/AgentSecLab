<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" role="img" aria-labelledby="title desc">
<title id="title">Loan Desk agent flow</title>
<desc id="desc">A model proposes a tool call; CTRL-LOANDESK-001 decides before the handler. ALLOW is not execution, and a valid call can still carry attacker text.</desc>
<rect width="880" height="384" fill="#F6F8FB"/>
<g font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#17202A">
<rect x="120" y="28" width="640" height="48" rx="4" fill="#FFFFFF" stroke="#D9E0E7"/>
<text x="440" y="58" text-anchor="middle" fill="#17202A">APPLICANT NOTES — untrusted text</text>
<path d="M440 76 V96" stroke="#8AA0B4" stroke-width="2" fill="none"/>
<rect x="120" y="96" width="640" height="48" rx="4" fill="#FFFFFF" stroke="#8AA0B4" stroke-dasharray="4 3"/>
<text x="440" y="126" text-anchor="middle" fill="#17202A">MODEL PROPOSES — one tool call</text>
<path d="M440 144 V164" stroke="#8AA0B4" stroke-width="2" fill="none"/>
<rect x="120" y="164" width="640" height="48" rx="4" fill="#0B1F33" stroke="#0B1F33"/>
<text x="440" y="194" text-anchor="middle" fill="#FFFFFF">CTRL-LOANDESK-001 — ALLOW / DENY</text>
<path d="M440 212 V232" stroke="#8AA0B4" stroke-width="2" fill="none"/>
<rect x="120" y="232" width="640" height="48" rx="4" fill="#FFFFFF" stroke="#007F86"/>
<text x="440" y="262" text-anchor="middle" fill="#17202A">HANDLER START — only after ALLOW</text>
<path d="M440 280 V300" stroke="#8AA0B4" stroke-width="2" fill="none"/>
<rect x="120" y="300" width="640" height="48" rx="4" fill="#FFFFFF" stroke="#D9E0E7"/>
<text x="440" y="330" text-anchor="middle" fill="#17202A">TELEMETRY — Splunk observes</text>
</g></svg>
