# Persistent HEC transport for the bundled Splunk.
# Cert+key PEM comes from scripts/hec-certs.sh (.certs/, git-ignored).
# Staged by splunk_app_init into the writable app volume; local/ outranks every app default/.
[http]
disabled = 0
enableSSL = 1
port = 8088
serverCert = /opt/agentsec-certs/hec.pem
sslVersions = tls1.2
