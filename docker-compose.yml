# AgentSec compose mesh.
# Copy .env.example to .env before starting. Do not commit .env.
# AGENTSEC_BIND_ADDRESS is the HOST-side publish address for the three learner ports 8000, 5001 and 5000.
# Default is 127.0.0.1. ./scripts/lab-up.sh forces that default; ./scripts/lab-up.sh --remote sets 0.0.0.0.
# It does not change the apps' in-container listener (AGENTSEC_BIND_HOST=0.0.0.0): Docker must reach them on the mesh.
# HEC (8088) and OTel (4317, 4318) stay on 127.0.0.1 in every mode. Splunk management (8089), Ollama and the verifier are not published.

networks:
  agentsec_mesh:
    driver: bridge

volumes:
  shared_telemetry:
  ollama_models:
  # Splunk's configuration (users, HEC, index definitions) and indexed events. NAMED on purpose: the image only declares these
  # paths as VOLUMEs, which Docker turns into ANONYMOUS volumes that `compose down` then `up` silently replaces with empty ones.
  # Named volumes survive stop/start, `up --force-recreate` AND `down` (only `down -v` removes them).
  splunk_etc:
  splunk_var:
  # Writable copy of splunk_app/agentsec. Splunk Ansible may chown this volume.
  # The repository tree is never mounted on /opt/splunk (EROFS / repo chown).
  splunk_app_agentsec:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: agentsec_ollama
    networks: [agentsec_mesh]
    # Do not publish 11434 on the host: a local Ollama often already binds it.
    # AcmeBank uses http://ollama:11434 on agentsec_mesh.
    volumes:
      - ollama_models:/root/.ollama
      - ./scripts/ollama_init.sh:/ollama_init.sh:ro
    entrypoint: ["/bin/bash", "/ollama_init.sh"]
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - OLLAMA_STARTUP_WAIT_SEC=${OLLAMA_STARTUP_WAIT_SEC:-300}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 300s

  acmebank:
    build:
      context: .
      dockerfile: docker/Dockerfile.acmebank
    container_name: agentsec_acmebank
    ports:
      - "${AGENTSEC_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    networks: [agentsec_mesh]
    volumes:
      - shared_telemetry:/var/log/agentsec
      - ./artifacts:/app/artifacts
      # Loan Desk verification receipts: written only by the host verifier. Read-only here, so nothing in this
      # container can forge a receipt. Must exist on the host before `up` (lab-up.sh creates it).
      - ./artifacts/loan_desk/receipts:/app/artifacts/loan_desk/receipts:ro
    environment:
      - AGENTSEC_BIND_HOST=0.0.0.0
      - ACMEBANK_PORT=5000
      - AGENTSEC_SECURITY_PROFILE=${AGENTSEC_SECURITY_PROFILE:-defended}
      - AGENTSEC_TESTBED_MODE=${AGENTSEC_TESTBED_MODE:-auto}
      - AGENTSEC_LAB_ID=${AGENTSEC_LAB_ID:-agentsec-local}
      - AGENTSEC_ARTIFACTS_DIR=/app/artifacts
      - AGENTSEC_OTEL_ENABLED=${AGENTSEC_OTEL_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - OTEL_COLLECTOR_HTTP=http://otel_collector:4318
      - OTEL_SERVICE_NAME=acmebank
      - DEPLOYMENT_ENVIRONMENT=lab
    depends_on:
      ollama:
        condition: service_healthy
      otel_collector:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  attack_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.attack
    container_name: agentsec_attack_service
    ports:
      - "${AGENTSEC_BIND_ADDRESS:-127.0.0.1}:5001:5001"
    networks: [agentsec_mesh]
    volumes:
      - ./artifacts:/app/artifacts
      - ./artifacts/loan_desk/receipts:/app/artifacts/loan_desk/receipts:ro
      - ./learning/level_1/LAB-PI-001/lab-manifest.json:/app/learning/level_1/LAB-PI-001/lab-manifest.json:ro
      - ./learning/level_1/LAB-MCP-001/lab-manifest.json:/app/learning/level_1/LAB-MCP-001/lab-manifest.json:ro
      - ./learning/level_1/LAB-RAG-CONTEXT/lab-manifest.json:/app/learning/level_1/LAB-RAG-CONTEXT/lab-manifest.json:ro
      - ./learning/level_1/LAB-MEMORY-001/lab-manifest.json:/app/learning/level_1/LAB-MEMORY-001/lab-manifest.json:ro
      - ./learning/level_1/LAB-AGENT-GOAL-INTEGRITY-001/lab-manifest.json:/app/learning/level_1/LAB-AGENT-GOAL-INTEGRITY-001/lab-manifest.json:ro
      - ./learning/level_1/LAB-AGENT-DELEGATION-001/lab-manifest.json:/app/learning/level_1/LAB-AGENT-DELEGATION-001/lab-manifest.json:ro
      - ./learning/level_1/LAB-AGENTSEC-CAPSTONE-001/lab-manifest.json:/app/learning/level_1/LAB-AGENTSEC-CAPSTONE-001/lab-manifest.json:ro
    environment:
      - AGENTSEC_BIND_HOST=0.0.0.0
      - ATTACK_SERVICE_PORT=5001
      - ACMEBANK_URL=http://acmebank:5000
      - AGENTSEC_ARTIFACTS_DIR=/app/artifacts
      - AGENTSEC_SPLUNK_WEB_URL=http://127.0.0.1:8000
    depends_on:
      acmebank:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: agentsec_otel_collector
    networks: [agentsec_mesh]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - shared_telemetry:/var/log/agentsec
      # Explicit HEC CA trust (public cert only). Verification stays on.
      - ${AGENTSEC_HEC_CA_FILE:-./.certs/hec-ca.crt}:/certs/hec-ca.crt:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      # Container DNS name, not the compose service alias (this host's Splunk
      # endpoint has aliases=[]). HEC is HTTPS and the name must match a cert SAN.
      - SPLUNK_HEC_ENDPOINT=${SPLUNK_HEC_ENDPOINT:-https://agentsec_splunk:8088/services/collector/event}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - SPLUNK_HEC_INDEX=${SPLUNK_HEC_INDEX:-agentsec_telemetry}
      - SPLUNK_HEC_SOURCETYPE=${SPLUNK_HEC_SOURCETYPE:-otel:agentic:json}
      - SPLUNK_HEC_SOURCE=${SPLUNK_HEC_SOURCE:-agentsec-otel-collector}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  splunk_app_init:
    image: busybox:1.36
    container_name: agentsec_splunk_app_init
    profiles: [local]
    networks: [agentsec_mesh]
    volumes:
      - ./splunk_app/agentsec:/src:ro
      - splunk_app_agentsec:/dest
      - ./scripts/splunk_app_init.sh:/splunk_app_init.sh:ro
    environment:
      - SPLUNK_APP_SRC=/src
      - SPLUNK_APP_DEST=/dest
    entrypoint: ["/bin/sh", "/splunk_app_init.sh"]
    restart: "no"

  splunk_hec_init:
    image: curlimages/curl:8.5.0
    container_name: agentsec_splunk_hec_init
    profiles: [local]
    networks: [agentsec_mesh]
    depends_on:
      splunk:
        condition: service_healthy
    environment:
      - SPLUNK_HOST=splunk
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - SPLUNK_HEC_INDEX=${SPLUNK_HEC_INDEX:-agentsec_telemetry}
      - SPLUNK_HEC_SOURCETYPE=${SPLUNK_HEC_SOURCETYPE:-otel:agentic:json}
      - SPLUNK_HEC_INPUT_NAME=${SPLUNK_HEC_INPUT_NAME:-agentsec-otel}
      - AGENTSEC_SPECIMEN_ROOT=/specimens
    volumes:
      - ./scripts/splunk_hec_init.sh:/splunk_hec_init.sh:ro
      - ${AGENTSEC_HEC_CA_FILE:-./.certs/hec-ca.crt}:/certs/hec-ca.crt:ro
      # Committed canonical REPLAY packs. Seeded here because this service
      # already owns the index and the HEC token.
      - ./learning/level_1:/specimens:ro
    entrypoint: ["/bin/sh", "/splunk_hec_init.sh"]
    restart: on-failure:3

  splunk:
    image: ${SPLUNK_IMAGE:-splunk/splunk:10.2}
    platform: ${SPLUNK_PLATFORM:-linux/amd64}
    container_name: agentsec_splunk
    profiles: [local]
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "${AGENTSEC_BIND_ADDRESS:-127.0.0.1}:8000:8000"
      - "127.0.0.1:8088:8088"
    networks: [agentsec_mesh]
    depends_on:
      splunk_app_init:
        condition: service_completed_successfully
    volumes:
      - shared_telemetry:/var/log/agentsec
      # Persistent Splunk state (see the top-level volumes comment). Admin password and HEC settings from .env apply only
      # when splunk_etc is first created empty; changing them in .env later does not change an existing splunk_etc.
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
      # Named volume: writable so Ansible chown works. Not a :ro bind of the repo.
      - splunk_app_agentsec:/opt/splunk/etc/apps/agentsec
      # HEC TLS: the [http] stanza ships in the staged app (splunk_app/agentsec/local/inputs.conf).
      # No :ro bind under etc/ (Ansible chowns it); the cert/key PEM sits outside /opt/splunk (Ansible chowns that tree).
      - ./.certs/hec.pem:/opt/agentsec-certs/hec.pem:ro
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - SPLUNK_HEC_SSL=1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/en-US/account/login && test -f /opt/splunk/etc/apps/agentsec/default/app.conf && test -f /opt/splunk/etc/apps/agentsec/default/data/ui/views/ws_lab_pi_001.xml",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
