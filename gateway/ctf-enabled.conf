# CTF through the gateway ENABLED (AGENTSEC_CTF_GATEWAY=enabled via docker-compose.gateway-ctf.yml; requires AGENTSEC_ATTACK_TIER=enabled because the operator
# check and quota are shared with the attack tier). ANCHORED allowlist: the captured id class has no dot, slash, percent or backslash, and the upstream URI is rebuilt
# from the captures. ONLY these locations include ctf-secret.conf (rendered by gateway.sh; it sets $gw_secret, which identity-headers.conf sends as X-AgentSec-Gateway-Secret).
# Pages (GET/HEAD), under the approved prefix. The JavaScript calls /api/ctf at the root, like every other /api route.
location ~ ^/attack-service/(?<asp>ctf|ctf/scoreboard|ctf/[A-Za-z0-9_-]+)$ {
  limit_except GET { deny all; }
  set $fwd_prefix /attack-service;
  include /etc/nginx/ctf-secret.conf;
  proxy_pass $attack/$asp;
}
# API reads (GET/HEAD).
location ~ ^/api/ctf/(?<ctfp>health|challenges|scoreboard|challenges/[A-Za-z0-9_-]+|challenges/[A-Za-z0-9_-]+/hint|attempts/[A-Za-z0-9_-]+)$ {
  limit_except GET { deny all; }
  include /etc/nginx/ctf-secret.conf;
  proxy_pass $attack/api/ctf/$ctfp;
}
# API writes (POST only): same-origin check, operator role and quota exactly as attack-enabled.conf, before the secret is ever attached.
location ~ ^/api/ctf/(?<ctfp>challenges/[A-Za-z0-9_-]+/attempts|attempts/[A-Za-z0-9_-]+/(?:run|verify|redeem|reset))$ {
  set $origin_seen $http_origin;
  if ($origin_seen = "") { set $origin_seen "https://$host$authority_port"; }
  if ($origin_seen != "https://$host$authority_port") { return 403; }
  if ($http_sec_fetch_site ~* "^(cross-site|same-site)$") { return 403; }
  auth_request /_authz_operator;
  auth_request_set $authz_reason $upstream_http_x_authz_reason;
  error_page 403 = @attack_denied;
  limit_except POST { deny all; }
  client_max_body_size 8k;
  include /etc/nginx/ctf-secret.conf;
  proxy_pass $attack/api/ctf/$ctfp;
}
