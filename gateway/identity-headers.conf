# Included in EVERY proxied location (nginx does not inherit proxy_set_header into a block that sets its own).
# Overwrites identity-bearing headers so a client can never assert who it is to a backend. Backends must not trust these headers anyway.
proxy_set_header Authorization "";
proxy_set_header X-Remote-User $remote_user;
proxy_set_header X-Auth-Role $role;
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header X-Forwarded-Groups "";
proxy_set_header X-Remote-Groups "";
proxy_set_header X-Remote-Email "";
proxy_set_header X-Auth-Request-User "";
proxy_set_header X-Auth-Request-Email "";
proxy_set_header X-Authenticated-User "";
proxy_set_header X-Authz-User "";             # only meaningful on the internal 8081 authorization hop, where the gateway sets it itself
proxy_set_header X-Authz-Method "";
proxy_set_header X-Authz-Reason "";
proxy_set_header X-AgentSec-Gateway-Secret $gw_secret;   # $gw_secret is "" (server level) everywhere except the CTF locations, which include the init-rendered ctf-secret.conf; a client-sent value never passes through
proxy_set_header X-Remote-Addr "";
proxy_set_header X-Remote-Host "";
proxy_set_header X-Remote-Role "";
proxy_set_header X-Remote-Roles "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Prefix $fwd_prefix;   # set by the gateway only (empty unless the location sets $fwd_prefix); a client-sent value never reaches a backend
