# Attack tier ENABLED. The only mutating routes. Requires role operator (403 otherwise), is size- and method-limited, and POSTs by an authorized operator are
# rate-limited (429 + Retry-After; the quota lives in the authorization subrequest, see gateway.conf.template).
location ~ ^/api/(launch$|attacks/ATK-002$|missions/loan-desk/(search/templates$|runs(/[A-Za-z0-9_-]+(/(search(/preview|/[A-Za-z0-9_-]+)?|verify))?)?$)|launches/[A-Za-z0-9_-]+(/evidence)?$) {
  # A request the browser marks cross-site, or whose Origin is not this deployment's own, is refused HERE (rewrite phase, before authorization and before
  # the quota), so a hostile page cannot make an operator's browser spend the operator's attack quota. The backends repeat the same check.
  set $origin_seen $http_origin;
  if ($origin_seen = "") { set $origin_seen "https://$host$authority_port"; }
  if ($origin_seen != "https://$host$authority_port") { return 403; }
  if ($http_sec_fetch_site ~* "^(cross-site|same-site)$") { return 403; }
  auth_request /_authz_operator;
  auth_request_set $authz_reason $upstream_http_x_authz_reason;
  error_page 403 = @attack_denied;
  limit_except GET POST { deny all; }
  client_max_body_size 64k;
  proxy_pass $attack;
}
location = /_authz_operator {
  internal;
  proxy_pass http://127.0.0.1:8081;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Authz-User $remote_user;    # set by the gateway from the authenticated user, never from the client
  proxy_set_header X-Authz-Method $request_method;   # the client's method (a subrequest reports the main request's), never a client header
}
location @attack_denied {
  if ($authz_reason = quota) {
    add_header Retry-After 10 always;
    # add_header in this block replaces the inherited security headers, so they are repeated
    add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always;
    return 429;
  }
  return 403;
}
