# Attack tier ENABLED. The only mutating routes. Requires role operator (403 otherwise), is rate-limited, size-limited and method-limited.
location ~ ^/api/(launch$|attacks/ATK-002$|missions/loan-desk/(search/templates$|runs(/[A-Za-z0-9_-]+(/(search(/preview|/[A-Za-z0-9_-]+)?|verify))?)?$)|launches/[A-Za-z0-9_-]+(/evidence)?$) {
  auth_request /_authz_operator;
  limit_except GET POST { deny all; }
  limit_req zone=attack burst=5 nodelay;
  client_max_body_size 64k;
  proxy_pass $attack;
}
location = /_authz_operator {
  internal;
  proxy_pass http://127.0.0.1:8081;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Authz-User $remote_user;    # set by the gateway from the authenticated user, never from the client
}
